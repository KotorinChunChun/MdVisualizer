<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MdVisualizer 同寸法UI比較</title><link rel="stylesheet" href="comparison.css"></head><body>
<header><strong>統合マスター — 同じ表示幅で比較</strong><div class="controls">
<label>対象 <select id="target"><option value="desktop">デスクトップ</option><option value="web">Web</option><option value="spfx">SPFx</option><option value="all">統合版</option></select></label>
<label>幅 <select id="width"><option>390</option><option>760</option><option>960</option><option selected>1280</option><option>1600</option></select></label>
<label>高さ <select id="height"><option>600</option><option selected>800</option><option>1000</option></select></label>
<label>テーマ <select id="theme"><option value="light">ライト</option><option value="dark">ダーク</option><option value="system">システム</option><option value="github">GitHub</option><option value="solarized">Solarized</option><option value="nord">Nord</option></select></label>
<label>文書倍率 <select id="zoom"><option>50</option><option>60</option><option>70</option><option>80</option><option>90</option><option selected>100</option><option>110</option><option>120</option><option>130</option><option>140</option><option>150</option><option>160</option><option>170</option><option>180</option><option>190</option><option>200</option></select></label>
<label><input id="php" type="checkbox">PHP保管</label>
<button id="show-baseline" aria-pressed="false">比較基準のApp</button><button id="show-result" aria-pressed="true">生成UI</button><button id="reset">両方を初期状態へ戻す</button><a id="standalone" target="_blank" rel="noopener">単独で開く</a>
</div><p id="metrics"></p><p>左右に縮小せず、同じ位置・寸法で切り替えます。基準は開発ソースのApp＋模擬文書です。実ファイル・OS機能は未接続。画面内で操作した状態は相互同期しません。</p></header>
<main><div id="stage"><iframe id="baseline" title="比較基準のApp" aria-hidden="true"></iframe><iframe id="result" title="生成UI" aria-hidden="false"></iframe></div></main><script src="comparison.js"></script></body></html>
