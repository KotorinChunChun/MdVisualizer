<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mermaid Studio — 図を編集</title><link rel="stylesheet" href="style.css"></head>
<body>
<header class="topbar"><div class="brand"><span class="brand-icon">M</span><div><strong>Mermaid Studio</strong></div></div><nav role="toolbar" aria-label="ファイルツールバー" title="ファイルツールバー"><button id="new" class="primary">＋ 新規作成</button><button id="open">開く</button><button id="folder">フォルダを開く</button><button id="save">保存</button></nav><span class="local-badge">ローカル編集</span></header>
<input id="files" type="file" accept=".mmd,.mermaid" multiple hidden><input id="folders" type="file" webkitdirectory multiple hidden>
<main>
<aside class="library"><div class="aside-title">ドキュメント <button id="load-samples" title="同梱サンプルを一覧へ追加">サンプル集</button></div><div id="documents"></div><div class="aside-footer"><span id="storage-state">ブラウザ内に自動保存</span><button id="help">操作ガイド</button></div></aside>
<section class="work"><div class="document-heading"><div><span id="type-name" class="eyebrow">FLOWCHART</span><input id="filename" aria-label="ファイル名" value="新しい図.mmd"></div><span id="status" role="status">準備中</span></div>
<div class="toolbar" role="toolbar" aria-label="編集ツールバー" title="編集ツールバー"><button id="snippets" class="accent">▦ 記法サンプル</button><button id="add">＋ 追加</button><button id="delete">削除</button><button id="edit">編集</button><button id="connect">接続</button><button id="sequence-note" hidden>注釈追加</button><button id="sequence-fragment" hidden>フラグメント追加</button><button id="sequence-box-add" hidden>ボックス追加</button><button id="sequence-activation" hidden>実行区間追加</button><button id="sequence-boxes" hidden>参加者グループ編集</button><button id="sequence-colors" hidden>シーケンス配色</button><button id="group">グループ化</button><button id="ungroup">解除</button><button id="before">手前と入れ替え</button><button id="after">後ろと入れ替え</button><span class="toolbar-spacer"></span><button id="undo" title="Ctrl+Z">↶</button><button id="redo" title="Ctrl+Y">↷</button><button id="replace">置換</button><button id="register">見本に登録</button></div>
<div class="split" id="split"><section class="code-pane"><div class="pane-title"><span>コード</span><span id="line-count"></span></div><div id="editor"></div><div id="diagnostics" aria-live="polite"></div></section><div id="divider" role="separator" tabindex="0" aria-label="左右の幅" aria-orientation="vertical"></div><section class="preview-pane"><div class="pane-title"><span>プレビュー</span><div class="preview-tools" role="toolbar" aria-label="プレビューツールバー" title="プレビューツールバー"><button id="show-ids" aria-pressed="false">変数名を表示</button><button id="theme">テーマ・配色</button><button id="fit">全体表示</button><button id="maximize">最大化</button></div></div><div id="canvas" tabindex="0" aria-label="図の編集領域"><div id="diagram"></div><div id="selection-box" hidden></div><button id="quick-add" hidden title="選択ノードから追加">＋</button><div id="preview-placeholder">図を描画しています…</div></div><div class="preview-footer"><span id="selection-label">ノードをクリックして選択</span><span id="zoom">100%</span></div></section></div>
<footer class="work-footer"><span>ホイール: ズーム · 中ドラッグ: 移動 · 中ダブルクリック: 全体表示</span><span id="gui-state">コードと図を連動</span></footer></section>
</main>
<dialog id="gallery"><div class="dialog-header"><div><span class="eyebrow">GALLERY</span><h2 id="gallery-title">図のテンプレート</h2></div><button data-close="gallery" aria-label="ギャラリーを閉じる">×</button></div><div class="gallery-body"><aside id="categories"></aside><div id="cards" class="cards"></div></div></dialog>
<dialog id="form"><form id="form-content"><div class="dialog-header"><h2 id="form-title">編集</h2><button type="button" data-close="form" aria-label="編集を閉じる">×</button></div><div id="form-fields"></div><footer><button type="button" data-close="form">キャンセル</button><button class="primary" type="submit">反映</button></footer></form></dialog>
<div id="context" role="menu" hidden></div><div id="toast" role="status" hidden></div>
<script type="module" src="app.js"></script></body></html>
