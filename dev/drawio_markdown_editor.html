            let cellStyle = `shape=rectangle;html=1;whiteSpace=wrap;strokeColor=none;fillColor=none;align=${align};verticalAlign=middle;fontColor=${fontColor};fontSize=${fontSize.toFixed(1)};fontFamily=${String(style['font-family'] || 'Arial').replace(/[;,]/g, ' ')};`;
            if (fontStyle !== '00') cellStyle += `fontStyle=${Number(fontStyle[0]) + Number(fontStyle[1])};`;
            if (Math.abs(rotation) > 0.01) cellStyle += `rotation=${rotation.toFixed(3)};`;
            cells.push(`<mxCell id="${nextId()}" value="${escapeXmlAttribute(text)}" style="${escapeXmlAttribute(cellStyle)}" vertex="1" parent="1"><mxGeometry x="${x.toFixed(2)}" y="${y.toFixed(2)}" width="${width.toFixed(2)}" height="${height.toFixed(2)}" as="geometry"/></mxCell>`);
            converted++;
            return;
          }

          if (tag === 'path') {
            const paths = sampleSvgPathData(el.getAttribute('d'), transform);
            if (!paths.length) { skipped++; return; }
            for (const path of paths) {
              if (path.closed && path.points.length >= 3 && svgColor(style.fill, '#000000') !== 'none') cells.push(svgPolygonCell(nextId(), path.points, style));
              else cells.push(svgPolylineEdgeCell(nextId(), path.points, style, path.closed));
              converted++;
            }
            return;
          }

          skipped++;
        };

        // root自体のtransformとCSSを反映してから子要素を変換する。
        const rootStyle = resolveSvgStyle(root, defaultStyle, cssRules);
        const rootTransform = multiplyMatrix(rootMatrix, parseSvgTransform(root.getAttribute('transform')));
        for (const child of root.children) visit(child, rootTransform, rootStyle);

        if (!converted) throw new Error('変換可能なSVG要素が見つかりませんでした。');
        if (skipped) console.info(`SVG→draw.io: ${converted}要素を変換、${skipped}要素をスキップしました。`);

        return `<mxGraphModel dx="1000" dy="700" grid="1" gridSize="10" guides="1" tooltips="1" connect="1" arrows="1" fold="1" page="1" pageScale="1" pageWidth="850" pageHeight="1100" math="0" shadow="0"><root><mxCell id="0"/><mxCell id="1" parent="0"/>${cells.join('')}</root></mxGraphModel>`;
      }

      function normalizeDrawioXml(data) {
        const value = (data || '').trim();
        if (!value) return '<mxGraphModel><root><mxCell id="0"/><mxCell id="1" parent="0"/></root></mxGraphModel>';
        if (value.startsWith('<')) return value;
        return `<mxfile host="embed.diagrams.net"><diagram name="Page-1">${escapeXmlText(value)}</diagram></mxfile>`;
      }

      function getDrawioBlocks(source) {
        const blocks = [];
        const re = /^(`{3,}|~{3,})[ \t]*drawio(?:[ \t]+[^\r\n]*)?\r?\n([\s\S]*?)\r?\n\1[ \t]*$/gmi;
        let match;
        while ((match = re.exec(source)) !== null) blocks.push({ start: match.index, end: re.lastIndex, fence: match[1], data: match[2] });
        return blocks;
      }

      function replaceDrawioBlock(source, targetIndex, newData) {
        let index = 0;
        const re = /^(`{3,}|~{3,})[ \t]*drawio(?:[ \t]+[^\r\n]*)?\r?\n([\s\S]*?)\r?\n\1[ \t]*$/gmi;
        return source.replace(re, (whole, fence) => index++ !== targetIndex ? whole : `${fence}drawio\n${newData.trim()}\n${fence}`);
      }

      function extractFenceData(xml) {
        const text = (xml || '').trim();
        if (!text.startsWith('<')) return text;
        try {
          const doc = new DOMParser().parseFromString(text, 'application/xml');
          if (doc.querySelector('parsererror')) return text;
          const root = doc.documentElement;
          if (root.tagName !== 'mxfile') return text;
          const diagram = root.querySelector('diagram');
          if (!diagram) return text;
          const elementChild = Array.from(diagram.childNodes).find(node => node.nodeType === Node.ELEMENT_NODE);
          return elementChild ? new XMLSerializer().serializeToString(elementChild) : (diagram.textContent || '').trim();
        } catch { return text; }
      }

      function getRasterImageBlocks(source) {
        const blocks = [];
        const markdownImageRe = /!\[([^\]]*)\]\(\s*<?(data:image\/(?:png|jpe?g|webp|gif|bmp|avif)(?:;[a-z0-9=._+-]+)*;base64,[a-z0-9+/=]+)>?(?:\s+(?:"[^"]*"|'[^']*'|\([^)]*\)))?\s*\)/gi;
        let match;
        while ((match = markdownImageRe.exec(source)) !== null) blocks.push({ start: match.index, end: markdownImageRe.lastIndex, whole: match[0], dataUri: match[2], kind: 'markdown' });
        const standaloneRe = /^[ \t]*(data:image\/(?:png|jpe?g|webp|gif|bmp|avif)(?:;[a-z0-9=._+-]+)*;base64,[a-z0-9+/=]+)[ \t]*$/gmi;
        while ((match = standaloneRe.exec(source)) !== null) blocks.push({ start: match.index, end: standaloneRe.lastIndex, whole: match[0], dataUri: match[1], kind: 'standalone' });
        blocks.sort((a, b) => a.start - b.start);
        return blocks;
      }

      function replaceRasterImage(source, targetIndex, newDataUri) {
        const block = getRasterImageBlocks(source)[targetIndex];
        if (!block) return source;
        const relativeStart = block.whole.indexOf(block.dataUri);
        if (relativeStart < 0) return source;
        const uriStart = block.start + relativeStart;
        return source.slice(0, uriStart) + newDataUri + source.slice(uriStart + block.dataUri.length);
      }

      function foldAllMarkdown() {
        cm.operation(() => {
          for (let i = cm.firstLine(); i <= cm.lastLine(); i++) {
            if (markdownFoldRange(cm, CodeMirror.Pos(i, 0))) cm.foldCode(CodeMirror.Pos(i, 0), { rangeFinder: markdownFoldRange }, 'fold');
          }
        });
      }
      function unfoldAllMarkdown() {
        cm.operation(() => {
          for (const mark of cm.getAllMarks()) if (mark.__isFold) mark.clear();
        });
      }
      function autoFoldBase64() {
        cm.operation(() => {
          for (let i = cm.firstLine(); i <= cm.lastLine(); i++) {
            const line = cm.getLine(i) || '';
            if (/data:image\/(?:png|jpe?g|webp|gif|bmp|avif).*;base64,/i.test(line)) {
              cm.foldCode(CodeMirror.Pos(i, 0), { rangeFinder: markdownFoldRange }, 'fold');
            }
          }
        });
      }

      function renderPreview() {
        drawioRenderIndex = 0;
        codeRenderBlocks = [];
        dataGridRenderBlocks = [];
        htmlPreviewBlocks = [];
        mermaidRenderBlocks = [];
        preview.innerHTML = marked.parse(injectRasterPlaceholders(markdown.value), { gfm: true, breaks: true });
        decorateRasterPlaceholders();
        decorateDataGridHosts();
        decorateHtmlPreviews();
        decorateMermaidPreviews().catch(error => console.error('Mermaid preview error:', error));
        if (window.GraphViewer && typeof window.GraphViewer.processElements === 'function') {
          try { window.GraphViewer.processElements(); } catch (error) { console.error('draw.io viewer error:', error); }
        }
      }
      function scheduleRender() { clearTimeout(renderTimer); renderTimer = setTimeout(renderPreview, 180); }

      function focusMarkdown(start, end = start) {
        markdown.focus();
        markdown.setSelectionRange(start, end);
      }

      function replaceSelection(replacement, selectStartOffset = null, selectEndOffset = null) {
        const start = markdown.selectionStart;
        const end = markdown.selectionEnd;
        markdown.setRangeText(replacement, start, end, 'end');
        const insertedStart = start;
        const insertedEnd = start + replacement.length;
        if (selectStartOffset !== null) {
          focusMarkdown(insertedStart + selectStartOffset, insertedStart + (selectEndOffset ?? selectStartOffset));
        } else {
          focusMarkdown(insertedEnd);
        }
        renderPreview();
        return { start: insertedStart, end: insertedEnd };
      }

      function wrapSelection(before, after = before, placeholder = 'テキスト') {
        const selected = markdown.value.slice(markdown.selectionStart, markdown.selectionEnd) || placeholder;
        const replacement = before + selected + after;
        const startOffset = before.length;
        replaceSelection(replacement, startOffset, startOffset + selected.length);
      }

      function prefixSelectedLines(prefix, fallback = '項目') {
        const value = markdown.value;
        let start = markdown.selectionStart;
        let end = markdown.selectionEnd;
        start = value.lastIndexOf('\n', Math.max(0, start - 1)) + 1;
        const nextNl = value.indexOf('\n', end);
        end = nextNl === -1 ? value.length : nextNl;
        let text = value.slice(start, end) || fallback;
        text = text.split('\n').map((line, i) => typeof prefix === 'function' ? prefix(line, i) : prefix + line).join('\n');
        markdown.setRangeText(text, start, end, 'select');
        renderPreview();
      }

      function insertHeading() {
        const value = markdown.value;
        let start = markdown.selectionStart;
        start = value.lastIndexOf('\n', Math.max(0, start - 1)) + 1;
        let lineEnd = value.indexOf('\n', markdown.selectionEnd);
        if (lineEnd === -1) lineEnd = value.length;
        let text = value.slice(start, lineEnd);
        if (!text.trim()) text = '見出し';
        const match = text.match(/^(#{1,6})\s+/);
        let replacement;
        if (!match) replacement = '## ' + text;
        else if (match[1].length < 6) replacement = '#'.repeat(match[1].length + 1) + ' ' + text.slice(match[0].length);
        else replacement = text.slice(match[0].length);
        markdown.setRangeText(replacement, start, lineEnd, 'select');
        renderPreview();
      }

      function insertLink() {
        const selected = markdown.value.slice(markdown.selectionStart, markdown.selectionEnd) || 'リンク文字列';
        const url = window.prompt('リンク先URLを入力してください。', 'https://');
        if (!url) return;
        const replacement = `[${selected}](${url})`;
        replaceSelection(replacement);
      }

      function insertCodeBlock() {
        const selected = markdown.value.slice(markdown.selectionStart, markdown.selectionEnd) || 'コード';
        const lang = window.prompt('言語名を入力してください（省略可）。', '') ?? '';
        const replacement = `\n\n\`\`\`${lang.trim()}\n${selected}\n\`\`\`\n\n`;
        const contentOffset = replacement.indexOf(selected);
        replaceSelection(replacement, contentOffset, contentOffset + selected.length);
      }

      function markdownTableCell(value) {
        return String(value ?? '')
          .replace(/\r?\n/g, '<br>')
          .replace(/\|/g, '\\|')
          .trim();
      }

      function makeMarkdownTable(headers, rows) {
        const head = `| ${headers.map(markdownTableCell).join(' | ')} |`;
        const separator = `| ${headers.map(() => '---').join(' | ')} |`;
        const body = rows.map(row => `| ${headers.map((_, i) => markdownTableCell(row[i] ?? '')).join(' | ')} |`).join('\n');
        return [head, separator, body].filter(Boolean).join('\n');
      }

      function insertTable() {
        // 挿入位置はモーダルを開いた時点で固定する。
        const selectionStart = markdown.selectionStart;
        const selectionEnd = markdown.selectionEnd;
        let editorHeaders = ['列1', '列2', '列3'];
        let editorRows = [['', '', ''], ['', '', '']];

        const overlay = document.createElement('div');
        overlay.className = 'table-editor-overlay';
        overlay.innerHTML = `<div class="table-editor-dialog" role="dialog" aria-modal="true" aria-label="table insert editor">
          <div class="table-editor-toolbar"><strong>表を挿入</strong>
            <label class="table-insert-format-label">挿入形式
              <select data-table-insert-format>
                <option value="markdown">Markdown表（直書き）</option>
                <option value="tsv">TSVコードブロック</option>
              </select>
            </label>
            <button type="button" class="data-grid-button" data-table-insert-action="add-row">行を追加</button>
            <button type="button" class="data-grid-button" data-table-insert-action="add-col">列を追加</button>
          </div>
          <div class="table-editor-note">TSV/CSVの「表を編集」と同じ操作です。ヘッダー・セルを直接編集し、各行・各列の × で削除できます。最後に Markdown直書き / TSVコードブロックを選んで挿入します。</div>
          <div class="table-editor-scroll"><table class="table-editor-grid"><thead></thead><tbody></tbody></table></div>
          <div class="table-editor-footer"><button type="button" class="data-grid-button" data-table-insert-action="cancel">キャンセル</button><button type="button" class="edit-button" data-table-insert-action="insert">挿入</button></div>
        </div>`;
        document.body.appendChild(overlay);

        const thead = overlay.querySelector('thead');
        const tbody = overlay.querySelector('tbody');
        const formatSelect = overlay.querySelector('[data-table-insert-format]');

        function normalizeRows() {
          const width = Math.max(1, editorHeaders.length);
          editorRows = editorRows.map(row => Array.from({ length: width }, (_, i) => row[i] ?? ''));
        }
        function collectFromDom() {
          const headCells = Array.from(thead.querySelectorAll('[data-edit-header]'));
          if (headCells.length) editorHeaders = headCells.map((cell, i) => editableCellText(cell) || `列${i + 1}`);
          editorRows = Array.from(tbody.querySelectorAll('tr')).map(tr => Array.from(tr.querySelectorAll('td[data-edit-cell]')).map(editableCellText));
          normalizeRows();
        }
        function renderEditor() {
          normalizeRows();
          thead.innerHTML = `<tr><th class="row-number">#</th>${editorHeaders.map((value, i) => `<th><div class="table-editor-col-head"><span class="table-editor-col-name" contenteditable="true" spellcheck="false" data-edit-header="${i}">${escapeHtml(value)}</span><button type="button" class="table-editor-delete" data-delete-insert-col="${i}" title="この列を削除" aria-label="列 ${i + 1} を削除">×</button></div></th>`).join('')}</tr>`;
          tbody.innerHTML = editorRows.map((row, r) => `<tr><td class="row-number"><span>${r + 1}</span> <button type="button" class="table-editor-delete" data-delete-insert-row="${r}" title="この行を削除" aria-label="行 ${r + 1} を削除">×</button></td>${row.map((value, c) => `<td contenteditable="true" spellcheck="false" data-edit-cell="${r}:${c}">${escapeHtml(value)}</td>`).join('')}</tr>`).join('');
        }
        function close() { overlay.remove(); }
        function commitInsert() {
          collectFromDom();
          const format = formatSelect.value;
          let text;
          if (format === 'tsv') {
            text = `\n\n\`\`\`tsv\n${makeCsvText([editorHeaders, ...editorRows], '\t')}\n\`\`\`\n\n`;
          } else {
            text = `\n\n${makeMarkdownTable(editorHeaders, editorRows)}\n\n`;
          }
          markdown.setRangeText(text, selectionStart, selectionEnd, 'end');
          close();
          renderPreview();
          markdown.focus();
        }

        renderEditor();
        overlay.addEventListener('click', event => {
          if (event.target === overlay) { close(); return; }

          const deleteRowButton = event.target.closest('[data-delete-insert-row]');
          if (deleteRowButton) {
            collectFromDom();
            const index = Number(deleteRowButton.dataset.deleteInsertRow);
            if (Number.isInteger(index) && index >= 0 && index < editorRows.length) editorRows.splice(index, 1);
            renderEditor();
            return;
          }

          const deleteColButton = event.target.closest('[data-delete-insert-col]');
          if (deleteColButton) {
            if (editorHeaders.length <= 1) { alert('列は1つ以上必要です。'); return; }
            collectFromDom();
            const index = Number(deleteColButton.dataset.deleteInsertCol);
            if (Number.isInteger(index) && index >= 0 && index < editorHeaders.length) {
              editorHeaders.splice(index, 1);
              editorRows.forEach(row => row.splice(index, 1));
            }
            renderEditor();
            return;
          }

          const button = event.target.closest('[data-table-insert-action]');
          if (!button) return;
          const action = button.dataset.tableInsertAction;
          if (action === 'cancel') { close(); return; }
          collectFromDom();
          if (action === 'add-row') {
            editorRows.push(editorHeaders.map(() => ''));
            renderEditor();
          } else if (action === 'add-col') {
            editorHeaders.push(`列${editorHeaders.length + 1}`);
            editorRows.forEach(row => row.push(''));
            renderEditor();
          } else if (action === 'insert') commitInsert();
        });
        overlay.addEventListener('keydown', event => {
          if (event.key === 'Escape') { event.preventDefault(); close(); }
          if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 's') {
            event.preventDefault();
            commitInsert();
          }
        });
        overlay.querySelector('[contenteditable="true"]')?.focus();
      }

      function insertMermaidBlock() {
        const selected = markdown.value.slice(markdown.selectionStart, markdown.selectionEnd).trim();
        const starter = selected || 'flowchart LR\n  A[開始] --> B[終了]';
        const replacement = `\n\n\`\`\`mermaid\n${starter}\n\`\`\`\n\n`;
        const contentOffset = replacement.indexOf(starter);
        replaceSelection(replacement, contentOffset, contentOffset + starter.length);
      }

      function handleMarkdownAction(action) {
        if (action === 'heading') insertHeading();
        else if (action === 'bold') wrapSelection('**', '**');
        else if (action === 'italic') wrapSelection('*', '*');
        else if (action === 'strike') wrapSelection('~~', '~~');
        else if (action === 'quote') prefixSelectedLines('> ', '引用');
        else if (action === 'ul') prefixSelectedLines('- ', '項目');
        else if (action === 'ol') prefixSelectedLines((line, i) => `${i + 1}. ${line}`, '項目');
        else if (action === 'task') prefixSelectedLines('- [ ] ', 'タスク');
        else if (action === 'link') insertLink();
        else if (action === 'inline-code') wrapSelection('`', '`', 'code');
        else if (action === 'code-block') insertCodeBlock();
        else if (action === 'table') insertTable();
        else if (action === 'mermaid') insertMermaidBlock();
        else if (action === 'hr') replaceSelection('\n\n---\n\n');
      }

      function getDrawioBlockIndexAtPosition(position) {
        const blocks = getDrawioBlocks(markdown.value);
        let candidate = blocks.findIndex(block => block.start <= position && block.end >= position);
        if (candidate >= 0) return candidate;
        candidate = blocks.findIndex(block => block.start >= position);
        return candidate >= 0 ? candidate : blocks.length - 1;
      }

      function createNewDrawio() {
        const starter = '<mxGraphModel><root><mxCell id="0"/><mxCell id="1" parent="0"/></root></mxGraphModel>';
        const insertion = `\n\n\`\`\`drawio\n${starter}\n\`\`\`\n\n`;
        const range = replaceSelection(insertion);
        const index = getDrawioBlockIndexAtPosition(range.start + 2);
        openDrawioEditor(index);
      }

      function isSupportedRasterFile(file) { return !!file && /^image\/(?:png|jpeg|webp|gif|bmp|avif)$/i.test(file.type || ''); }

      function fileToDataUri(file) {
        return new Promise((resolve, reject) => {
          if (!isSupportedRasterFile(file)) { reject(new Error('対応するラスター画像ではありません。')); return; }
          const reader = new FileReader();
          reader.onload = () => resolve(String(reader.result));
          reader.onerror = () => reject(new Error('画像を読み込めませんでした。'));
          reader.readAsDataURL(file);
        });
      }

      function escapeAltText(text) { return String(text || '画像').replace(/[\[\]\\]/g, '\\$&'); }

      function insertDataUriImage(dataUri, alt = '画像') {
        replaceSelection(`![${escapeAltText(alt)}](${dataUri})`);
      }

      async function insertImageFiles(files) {
        const imageFiles = Array.from(files || []).filter(isSupportedRasterFile);
        if (!imageFiles.length) { alert('画像ファイルがありません。'); return; }
        const chunks = [];
        for (const file of imageFiles) {
          try { chunks.push(`![${escapeAltText(file.name || '画像')}](${await fileToDataUri(file)})`); }
          catch (error) { console.error(error); }
        }
        if (chunks.length) { replaceSelection(chunks.join('\n\n')); requestAnimationFrame(autoFoldBase64); }
      }

      async function insertClipboardImage() {
        if (!navigator.clipboard?.read) {
          alert('このブラウザではボタンからクリップボード画像を取得できません。左のMarkdown欄にフォーカスして Ctrl+V してください。画像の貼り付けには対応しています。');
          markdown.focus();
          return;
        }
        try {
          const items = await navigator.clipboard.read();
          for (const item of items) {
            const type = item.types.find(type => type.startsWith('image/'));
            if (!type) continue;
            const blob = await item.getType(type);
            const file = new File([blob], 'clipboard-image.' + (type.split('/')[1] || 'png'), { type });
            await insertImageFiles([file]);
            return;
          }
          alert('クリップボードに画像がありません。');
        } catch (error) {
          console.error(error);
          alert('クリップボード画像を取得できませんでした。左のMarkdown欄で Ctrl+V すると画像をBase64で挿入できます。');
          markdown.focus();
        }
      }

      function resetDrawioEditorState() {
        if (drawioWindowWatch) { clearInterval(drawioWindowWatch); drawioWindowWatch = null; }
        drawioWindow = null;
        editingDrawioIndex = null;
        editingXml = null;
        editingDrawioDescriptor = null;
      }

      async function openDrawioEditor(index) {
        const block = getDrawioBlocks(markdown.value)[index];
        if (!block) return;
        editingDrawioIndex = index;

        if (drawioWindow && !drawioWindow.closed) { try { drawioWindow.close(); } catch {} }

        // ユーザー操作の直後にabout:blankを先に開き、ポップアップブロックを避ける。
        drawioWindow = window.open('', 'markdown-drawio-editor', 'popup=yes,width=1400,height=900,resizable=yes,scrollbars=yes');
        if (!drawioWindow) {
          resetDrawioEditorState();
          alert('draw.io編集ウィンドウを開けませんでした。ポップアップ許可を確認してください。');
          return;
        }
        try {
          drawioWindow.document.title = 'draw.ioを準備中';
          drawioWindow.document.body.innerHTML = '<p style="font:14px system-ui;padding:24px">draw.ioを準備しています…</p>';
        } catch {}

        try {
          const data = String(block.data || '').trim();
          editingDrawioDescriptor = null;
          if (isSvgMarkup(data)) {
            // 一般SVGはHTML側のSVG→mxGraph変換器でネイティブ図形へ変換する。
            editingXml = svgToDrawioXml(data);
          } else if (isMermaidSource(data)) {
            // MermaidはSVG経由で変換しない。draw.io公式Embed APIのmermaid descriptorを
            // そのまま渡し、draw.io自身のネイティブMermaidパーサ/レイアウトを使う。
            // wrap:false により保存結果は通常の編集可能なdraw.ioセル群になる。
            editingXml = null;
            editingDrawioDescriptor = { format: 'mermaid', data, wrap: false };
          } else {
            editingXml = normalizeDrawioXml(data);
          }
        } catch (error) {
          console.error(error);
          const popup = drawioWindow;
          resetDrawioEditorState();
          if (popup && !popup.closed) { try { popup.close(); } catch {} }
          alert('draw.io形式へ変換できませんでした。\n' + (error?.message || error));
          return;
        }

        try { drawioWindow.location.replace(EDITOR_URL); }
        catch { drawioWindow.location.href = EDITOR_URL; }
        try { drawioWindow.focus(); } catch {}
        drawioWindowWatch = setInterval(() => {
          if (!drawioWindow || drawioWindow.closed) resetDrawioEditorState();
        }, 500);
      }
      function closeDrawioEditor() {
        const popup = drawioWindow;
        resetDrawioEditorState();
        if (popup && !popup.closed) { try { popup.close(); } catch {} }
      }

      function loadRasterIntoCanvas(dataUri, resetHistory = true) {
        return new Promise((resolve, reject) => {
          const image = new Image();
          image.onload = () => {
            paintCanvas.width = image.naturalWidth;
            paintCanvas.height = image.naturalHeight;
            ctx.clearRect(0, 0, paintCanvas.width, paintCanvas.height);
            ctx.globalCompositeOperation = 'source-over';
            ctx.drawImage(image, 0, 0);
            if (resetHistory) { history = [captureState()]; redoStack = []; updateHistoryButtons(); }
            updatePaintStatus();
            resolve();
          };
          image.onerror = () => reject(new Error('画像を読み込めませんでした。'));
          image.src = dataUri;
        });
      }

      function captureState() {
        return { width: paintCanvas.width, height: paintCanvas.height, imageData: ctx.getImageData(0, 0, paintCanvas.width, paintCanvas.height) };
      }
      function restoreState(state) {
        if (!state) return;
        paintCanvas.width = state.width;
        paintCanvas.height = state.height;
        ctx.putImageData(state.imageData, 0, 0);
        updatePaintStatus();
      }
      function commitHistory() {
        history.push(captureState());
        if (history.length > HISTORY_LIMIT) history.shift();
        redoStack = [];
        updateHistoryButtons();
      }
      function updateHistoryButtons() {
        paintUndo.disabled = history.length <= 1;
        paintRedo.disabled = redoStack.length === 0;
      }
      function undo() {
        if (history.length <= 1) return;
        redoStack.push(history.pop());
        restoreState(history[history.length - 1]);
        updateHistoryButtons();
      }
      function redo() {
        if (!redoStack.length) return;
        const state = redoStack.pop();
        history.push(state);
        restoreState(state);
        updateHistoryButtons();
      }

      async function openRasterEditor(index) {
        const block = getRasterImageBlocks(markdown.value)[index];
        if (!block) return;
        editingRasterIndex = index;
        editingRasterOriginal = block.dataUri;
        try { await loadRasterIntoCanvas(block.dataUri, true); }
        catch (error) { alert(error.message); editingRasterIndex = null; editingRasterOriginal = null; return; }
        setPaintTool('pencil');
        paintOverlay.classList.add('open');
        paintOverlay.setAttribute('aria-hidden', 'false');
      }
      function closeRasterEditor() {
        paintOverlay.classList.remove('open');
        paintOverlay.setAttribute('aria-hidden', 'true');
        painting = false; startPoint = null; lastPoint = null; dragSnapshot = null;
        editingRasterIndex = null; editingRasterOriginal = null; history = []; redoStack = [];
      }

      function setPaintTool(tool) {
        paintTool = tool;
        for (const button of toolButtons) {
          const active = button.dataset.paintTool === tool;
          button.classList.toggle('active', active);
          button.classList.toggle('secondary', !active);
        }
        const cursors = { fill: 'cell', picker: 'copy', text: 'text', crop: 'crosshair', eraser: 'crosshair' };
        paintCanvas.style.cursor = cursors[tool] || 'crosshair';
      }
      function updatePaintStatus(extra = '') {
        paintStatus.textContent = `${paintCanvas.width} × ${paintCanvas.height}px${extra ? ' / ' + extra : ''}`;
      }
      function canvasPoint(event) {
        const rect = paintCanvas.getBoundingClientRect();
        return { x: Math.max(0, Math.min(paintCanvas.width, (event.clientX - rect.left) * (paintCanvas.width / rect.width))), y: Math.max(0, Math.min(paintCanvas.height, (event.clientY - rect.top) * (paintCanvas.height / rect.height))) };
      }
      function isDragTool(tool) { return ['line', 'arrow', 'rect', 'roundrect', 'ellipse', 'triangle', 'crop'].includes(tool); }
      function isFreehandTool(tool) { return ['pencil', 'brush', 'eraser'].includes(tool); }

      function applyStrokeSettings(tool = paintTool) {
        ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        ctx.lineWidth = tool === 'brush' ? Math.max(3, Number(paintSize.value) * 2) : Number(paintSize.value);
        ctx.strokeStyle = paintColor.value;
        ctx.fillStyle = paintColor.value;
        ctx.globalCompositeOperation = tool === 'eraser' ? 'destination-out' : 'source-over';
      }
      function drawDot(point) {
        ctx.save(); applyStrokeSettings();
        const radius = (paintTool === 'brush' ? Math.max(3, Number(paintSize.value) * 2) : Number(paintSize.value)) / 2;
        ctx.beginPath(); ctx.arc(point.x, point.y, radius, 0, Math.PI * 2); ctx.fillStyle = paintTool === 'eraser' ? '#000' : paintColor.value; ctx.fill(); ctx.restore();
      }
      function drawFreehand(from, to) {
        ctx.save(); applyStrokeSettings();
        ctx.beginPath(); ctx.moveTo(from.x, from.y); ctx.lineTo(to.x, to.y); ctx.stroke(); ctx.restore();
      }

      function normalizedRect(a, b) { return { x: Math.min(a.x, b.x), y: Math.min(a.y, b.y), w: Math.abs(b.x - a.x), h: Math.abs(b.y - a.y) }; }
      function roundRectPath(x, y, w, h, radius) {
        const r = Math.min(radius, Math.abs(w) / 2, Math.abs(h) / 2);
        ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
      }
      function drawArrow(a, b) {
        const angle = Math.atan2(b.y - a.y, b.x - a.x);
        const head = Math.max(10, Number(paintSize.value) * 4);
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x - head * Math.cos(angle - Math.PI / 6), b.y - head * Math.sin(angle - Math.PI / 6)); ctx.lineTo(b.x - head * Math.cos(angle + Math.PI / 6), b.y - head * Math.sin(angle + Math.PI / 6)); ctx.closePath();
        if (paintFillShape.checked) ctx.fill(); else ctx.stroke();
      }
      function drawShape(tool, a, b, previewMode = false) {
        ctx.save(); applyStrokeSettings(tool); ctx.globalCompositeOperation = 'source-over';
        const r = normalizedRect(a, b);
        if (tool === 'line') { ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); }
        else if (tool === 'arrow') drawArrow(a, b);
        else if (tool === 'rect') { if (paintFillShape.checked) ctx.fillRect(r.x, r.y, r.w, r.h); else ctx.strokeRect(r.x, r.y, r.w, r.h); }
        else if (tool === 'roundrect') { roundRectPath(r.x, r.y, r.w, r.h, Math.max(6, Math.min(r.w, r.h) * .12)); paintFillShape.checked ? ctx.fill() : ctx.stroke(); }
        else if (tool === 'ellipse') { ctx.beginPath(); ctx.ellipse(r.x + r.w / 2, r.y + r.h / 2, r.w / 2, r.h / 2, 0, 0, Math.PI * 2); paintFillShape.checked ? ctx.fill() : ctx.stroke(); }
        else if (tool === 'triangle') { ctx.beginPath(); ctx.moveTo(r.x + r.w / 2, r.y); ctx.lineTo(r.x + r.w, r.y + r.h); ctx.lineTo(r.x, r.y + r.h); ctx.closePath(); paintFillShape.checked ? ctx.fill() : ctx.stroke(); }
        else if (tool === 'crop') { ctx.setLineDash([6, 4]); ctx.lineWidth = 1; ctx.strokeStyle = '#0969da'; ctx.strokeRect(r.x + .5, r.y + .5, r.w, r.h); }
        ctx.restore();
      }

      function colorsMatch(data, index, target) { return data[index] === target[0] && data[index+1] === target[1] && data[index+2] === target[2] && data[index+3] === target[3]; }
      function hexToRgba(hex) { const n = parseInt(hex.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255, 255]; }
      function floodFill(point) {
        const x = Math.floor(point.x), y = Math.floor(point.y);
        if (x < 0 || y < 0 || x >= paintCanvas.width || y >= paintCanvas.height) return false;
        const image = ctx.getImageData(0, 0, paintCanvas.width, paintCanvas.height); const data = image.data; const width = image.width; const height = image.height;
        const start = (y * width + x) * 4; const target = [data[start], data[start+1], data[start+2], data[start+3]]; const replacement = hexToRgba(paintColor.value);
        if (target.every((v, i) => v === replacement[i])) return false;
        // Scanline flood fill: 大きな単色領域でも4近傍を大量pushしない。
        const stack = [[x, y]];
        const seen = new Uint8Array(width * height);
        while (stack.length) {
          const [sx, sy] = stack.pop();
          if (sx < 0 || sy < 0 || sx >= width || sy >= height) continue;
          let left = sx;
          while (left >= 0) {
            const i = (sy * width + left) * 4;
            if (!colorsMatch(data, i, target)) break;
            left--;
          }
          left++;
          let spanUp = false, spanDown = false;
          for (let cx = left; cx < width; cx++) {
            const p = sy * width + cx;
            const i = p * 4;
            if (!colorsMatch(data, i, target)) break;
            if (!seen[p]) {
              seen[p] = 1;
              data[i] = replacement[0]; data[i+1] = replacement[1]; data[i+2] = replacement[2]; data[i+3] = replacement[3];
            }
            if (sy > 0) {
              const up = ((sy - 1) * width + cx) * 4;
              const matchUp = colorsMatch(data, up, target);
              if (matchUp && !spanUp) { stack.push([cx, sy - 1]); spanUp = true; }
              else if (!matchUp) spanUp = false;
            }
            if (sy < height - 1) {
              const down = ((sy + 1) * width + cx) * 4;
              const matchDown = colorsMatch(data, down, target);
              if (matchDown && !spanDown) { stack.push([cx, sy + 1]); spanDown = true; }
              else if (!matchDown) spanDown = false;
            }
          }
        }
        ctx.putImageData(image, 0, 0); return true;
      }
      function pickColor(point) {
        const x = Math.min(paintCanvas.width - 1, Math.max(0, Math.floor(point.x))); const y = Math.min(paintCanvas.height - 1, Math.max(0, Math.floor(point.y)));
        const d = ctx.getImageData(x, y, 1, 1).data;
        paintColor.value = '#' + [d[0], d[1], d[2]].map(v => v.toString(16).padStart(2, '0')).join('');
        updatePaintStatus(`RGB ${d[0]}, ${d[1]}, ${d[2]}`);
      }
      function drawText(point) {
        const text = window.prompt('入力する文字を入力してください。'); if (!text) return false;
        ctx.save(); ctx.globalCompositeOperation = 'source-over'; ctx.fillStyle = paintColor.value; ctx.font = `${Math.max(6, Number(paintFontSize.value) || 24)}px "Segoe UI", sans-serif`; ctx.textBaseline = 'top';
        const lineHeight = Math.max(8, (Number(paintFontSize.value) || 24) * 1.25);
        text.split(/\r?\n/).forEach((line, i) => ctx.fillText(line, point.x, point.y + i * lineHeight)); ctx.restore(); return true;
      }
      function cropTo(a, b) {
        const r = normalizedRect(a, b); const x = Math.round(r.x), y = Math.round(r.y), w = Math.round(r.w), h = Math.round(r.h); if (w < 2 || h < 2) return false;
        const temp = document.createElement('canvas'); temp.width = w; temp.height = h; temp.getContext('2d').drawImage(paintCanvas, x, y, w, h, 0, 0, w, h);
        paintCanvas.width = w; paintCanvas.height = h; ctx.drawImage(temp, 0, 0); updatePaintStatus(); return true;
      }
      function transformCanvas(kind) {
        const src = document.createElement('canvas'); src.width = paintCanvas.width; src.height = paintCanvas.height; src.getContext('2d').drawImage(paintCanvas, 0, 0);
        let w = src.width, h = src.height; if (kind === 'left' || kind === 'right') [w, h] = [h, w]; paintCanvas.width = w; paintCanvas.height = h; ctx.save();
        if (kind === 'right') { ctx.translate(w, 0); ctx.rotate(Math.PI / 2); }
        else if (kind === 'left') { ctx.translate(0, h); ctx.rotate(-Math.PI / 2); }
        else if (kind === 'flipH') { ctx.translate(w, 0); ctx.scale(-1, 1); }
        else if (kind === 'flipV') { ctx.translate(0, h); ctx.scale(1, -1); }
        ctx.drawImage(src, 0, 0); ctx.restore(); updatePaintStatus(); commitHistory();
      }
      function resizeCanvas() {
        const answer = window.prompt('新しいサイズを「幅x高さ」で入力してください。', `${paintCanvas.width}x${paintCanvas.height}`); if (!answer) return;
        const match = answer.trim().match(/^(\d+)\s*[x×,]\s*(\d+)$/i); if (!match) { alert('例: 640x480 の形式で入力してください。'); return; }
        const w = Math.max(1, Math.min(10000, Number(match[1]))), h = Math.max(1, Math.min(10000, Number(match[2])));
        const src = document.createElement('canvas'); src.width = paintCanvas.width; src.height = paintCanvas.height; src.getContext('2d').drawImage(paintCanvas, 0, 0);
        paintCanvas.width = w; paintCanvas.height = h; ctx.imageSmoothingEnabled = true; ctx.drawImage(src, 0, 0, w, h); updatePaintStatus(); commitHistory();
      }

      function beginPaint(event) {
        if (event.button !== undefined && event.button !== 0) return;
        const p = canvasPoint(event); event.preventDefault();
        if (paintTool === 'fill') { if (floodFill(p)) commitHistory(); return; }
        if (paintTool === 'picker') { pickColor(p); return; }
        if (paintTool === 'text') { if (drawText(p)) commitHistory(); return; }
        painting = true; startPoint = p; lastPoint = p; paintCanvas.setPointerCapture?.(event.pointerId);
        if (isDragTool(paintTool)) dragSnapshot = ctx.getImageData(0, 0, paintCanvas.width, paintCanvas.height);
        else if (isFreehandTool(paintTool)) drawDot(p);
      }
      function movePaint(event) {
        if (!painting) return; const p = canvasPoint(event); event.preventDefault();
        if (isFreehandTool(paintTool)) { drawFreehand(lastPoint, p); lastPoint = p; }
        else if (isDragTool(paintTool) && dragSnapshot) { ctx.putImageData(dragSnapshot, 0, 0); drawShape(paintTool, startPoint, p, true); }
        updatePaintStatus(`${Math.round(p.x)}, ${Math.round(p.y)}`);
      }
      function endPaint(event) {
        if (!painting) return; const p = event ? canvasPoint(event) : lastPoint; event?.preventDefault();
        if (isDragTool(paintTool) && dragSnapshot) {
          ctx.putImageData(dragSnapshot, 0, 0);
          if (paintTool === 'crop') { if (cropTo(startPoint, p)) commitHistory(); }
          else { drawShape(paintTool, startPoint, p); commitHistory(); }
        } else if (isFreehandTool(paintTool)) commitHistory();
        painting = false; startPoint = null; lastPoint = null; dragSnapshot = null;
        if (event?.pointerId !== undefined) { try { paintCanvas.releasePointerCapture?.(event.pointerId); } catch {} }
        updatePaintStatus();
      }

      preview.addEventListener('click', async event => {
        const d = event.target.closest('[data-edit-drawio]'); if (d) { openDrawioEditor(Number(d.dataset.editDrawio)); return; }
        const r = event.target.closest('[data-edit-raster]'); if (r) { openRasterEditor(Number(r.dataset.editRaster)); return; }
        const copy = event.target.closest('[data-copy-code]');
        if (copy) {
          const text = codeRenderBlocks[Number(copy.dataset.copyCode)];
          const ok = await copyTextToClipboard(text ?? '');
          const original = copy.textContent;
          copy.textContent = ok ? 'コピー済み' : '失敗';
          setTimeout(() => { copy.textContent = original; }, 1000);
          return;
        }
        const openHtml = event.target.closest('[data-open-html]');
        if (openHtml) { openHtmlPreviewWindow(Number(openHtml.dataset.openHtml)); return; }
        const reload = event.target.closest('[data-reload-html]');
        if (reload) {
          const index = Number(reload.dataset.reloadHtml);
          const host = preview.querySelector(`[data-html-shadow="${index}"]`);
          const block = htmlPreviewBlocks[index];
          if (host && block) renderHtmlShadowPreview(host, block.raw);
        }
      });

      window.addEventListener('message', event => {
        if (event.origin !== DRAWIO_ORIGIN || !drawioWindow || event.source !== drawioWindow) return;
        let message; try { message = typeof event.data === 'string' ? JSON.parse(event.data) : event.data; } catch { return; }
        if (message.event === 'init') {
          const load = { action: 'load', title: 'Markdown diagram', noSaveBtn: 1, saveAndExit: 1 };
          if (editingDrawioDescriptor) load.descriptor = editingDrawioDescriptor;
          else load.xml = editingXml;
          drawioWindow.postMessage(JSON.stringify(load), DRAWIO_ORIGIN);
          return;
        }
        if (message.event === 'save' && editingDrawioIndex !== null && message.xml) { markdown.value = replaceDrawioBlock(markdown.value, editingDrawioIndex, extractFenceData(message.xml)); renderPreview(); if (message.exit) closeDrawioEditor(); return; }
        if (message.event === 'exit') closeDrawioEditor();
      });

      toolButtons.forEach(button => button.addEventListener('click', () => setPaintTool(button.dataset.paintTool)));
      paintSize.addEventListener('input', () => paintSizeValue.textContent = `${paintSize.value} px`);
      paintUndo.addEventListener('click', undo); paintRedo.addEventListener('click', redo);
      paintRotateLeft.addEventListener('click', () => transformCanvas('left'));
      paintRotateRight.addEventListener('click', () => transformCanvas('right'));
      paintFlipH.addEventListener('click', () => transformCanvas('flipH'));
      paintFlipV.addEventListener('click', () => transformCanvas('flipV'));
      paintResize.addEventListener('click', resizeCanvas);
      paintClear.addEventListener('click', () => { ctx.save(); ctx.globalCompositeOperation = 'source-over'; ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, paintCanvas.width, paintCanvas.height); ctx.restore(); commitHistory(); });
      paintReset.addEventListener('click', async () => { if (!editingRasterOriginal) return; try { await loadRasterIntoCanvas(editingRasterOriginal, true); } catch (error) { alert(error.message); } });
      paintCancel.addEventListener('click', closeRasterEditor);
      paintSave.addEventListener('click', () => { if (editingRasterIndex === null) return; const newDataUri = paintCanvas.toDataURL('image/png'); markdown.value = replaceRasterImage(markdown.value, editingRasterIndex, newDataUri); closeRasterEditor(); renderPreview(); });

      paintCanvas.addEventListener('pointerdown', beginPaint);
      paintCanvas.addEventListener('pointermove', movePaint);
      paintCanvas.addEventListener('pointerup', endPaint);
      paintCanvas.addEventListener('pointercancel', endPaint);
      paintCanvas.addEventListener('pointerleave', event => { if (!paintCanvas.hasPointerCapture?.(event.pointerId)) endPaint(event); });

      mdToolbar.addEventListener('click', event => {
        const button = event.target.closest('[data-md-action]');
        if (button) handleMarkdownAction(button.dataset.mdAction);
      });
      newDrawioButton.addEventListener('click', createNewDrawio);
      clipboardImageButton.addEventListener('click', insertClipboardImage);
      uploadImageButton.addEventListener('click', () => imageFileInput.click());
      imageFileInput.addEventListener('change', async () => {
        await insertImageFiles(imageFileInput.files);
        imageFileInput.value = '';
      });
      cm.getWrapperElement().addEventListener('paste', async event => {
        const files = Array.from(event.clipboardData?.files || []).filter(isSupportedRasterFile);
        if (!files.length) return;
        event.preventDefault();
        await insertImageFiles(files);
        requestAnimationFrame(autoFoldBase64);
      });
      foldAllButton.addEventListener('click', foldAllMarkdown);
      unfoldAllButton.addEventListener('click', unfoldAllMarkdown);

      cm.on('change', scheduleRender);
      viewerScript.addEventListener('load', renderPreview);
      updateHistoryButtons();
      renderPreview();
      requestAnimationFrame(() => { cm.refresh(); autoFoldBase64(); });
    })();
  </script>
</body>
</html>
