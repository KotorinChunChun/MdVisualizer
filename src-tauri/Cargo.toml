[package]
name = "mdvisualizer"
version = "0.0.18+beta.2"
description = "Fast Markdown Viewer Desktop App"
authors = ["KotorinChunChun"]
license = "MIT"
edition = "2021"

[lib]
name = "mdvisualizer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
notify = "6"
image = "0.25"
tempfile = "3"
sha2 = "0.10"
walkdir = "2"
regex = "1"
encoding_rs = "0.8.35"
chardetng = "1.0.0"
chrono = "0.4.45"
base64 = "0.22"
fs4 = "1.1.0"
dirs = "6"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Credentials", "Win32_Storage_FileSystem", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_UI_Shell"] }
url = "2"
percent-encoding = "2"
reqwest = { version = "0.13", features = ["json", "form"] }
tokio = { version = "1", features = ["sync", "time", "process", "io-util", "macros", "rt"] }
