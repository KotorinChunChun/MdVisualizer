<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>実物UIから生成する統合マスター</title><style>body{margin:0;font:14px system-ui;background:#f6f8fa;color:#1f2328}header{padding:10px 14px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}select,button{font:inherit;padding:5px}p{margin:0;color:#57606a;font-size:12px}main{display:flex;height:calc(100vh - 95px);gap:8px;padding:0 8px}section{flex:1;min-width:0;display:flex;flex-direction:column}iframe{width:100%;flex:1;border:1px solid #d0d7de;background:white}h2{font-size:12px;margin:4px 0}[hidden]{display:none!important}</style></head><body><header><strong>実物UIを使った統合マスター</strong><label>対象 <select id="target"><option value="desktop">デスクトップ</option><option value="web">Web</option><option value="spfx">SPFx</option><option value="all">統合（全環境）</option></select></label><label><input id="compare" type="checkbox">元のAppと並べる</label><button id="reset">同じ初期状態へ戻す</button><p>保存・OS連携は未接続。画面は実物のApp.tsxと部品・CSSを使用。比較時は各画面を同じ操作・幅に合わせてください。</p></header><main><section id="baseline" hidden><h2>比較基準：元のApp.tsx＋模擬ホスト</h2><iframe title="元のデスクトップUI" src="reference.html"></iframe></section><section><h2>統合マスターから生成したUI</h2><iframe id="result" title="生成UI" src="faithful-desktop.html"></iframe></section></main><script>const target=document.getElementById('target'),result=document.getElementById('result');target.onchange=()=>{result.src='faithful-'+target.value+'.html'};document.getElementById('compare').onchange=e=>{document.getElementById('baseline').hidden=!e.target.checked};document.getElementById('reset').onclick=()=>{result.src='faithful-'+target.value+'.html';document.querySelector('#baseline iframe').src='reference.html'};</script></body></html>
